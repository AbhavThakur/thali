name: Supabase keepalive

# Free Supabase projects pause after 7 days without activity. This pings the database
# every Monday and Thursday (never more than 4 days apart).
on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call keepalive()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Add SUPABASE_URL and SUPABASE_ANON_KEY as repository secrets." >&2
            exit 1
          fi
          curl --silent --show-error --fail-with-body --max-time 30 --retry 3 --retry-delay 10 \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/keepalive" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
